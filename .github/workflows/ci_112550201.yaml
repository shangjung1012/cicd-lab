name: ci-112550201

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-112550201-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Run tests with JUnit report
        id: test
        run: |
          mkdir -p reports
          npm test -- \
            --reporter=default \
            --reporter=junit \
            --outputFile=reports/vitest-junit-node-${{ matrix.node-version }}.xml

      - name: Upload test report artifact
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit-node-${{ matrix.node-version }}
          path: reports/vitest-junit-node-${{ matrix.node-version }}.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Vitest Results (Node ${{ matrix.node-version }})
          path: reports/vitest-junit-node-${{ matrix.node-version }}.xml
          reporter: java-junit
          fail-on-empty: true
          fail-on-error: true
          use-actions-summary: true

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t my-app:ci-${{ github.sha }} .
